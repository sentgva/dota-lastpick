name: Collect match stats

# Данные копятся сами: каждый прогон добавляет матчи к снапшоту.
on:
  schedule:
    - cron: '17 3 * * *'   # ежедневно ночью
  workflow_dispatch:
    inputs:
      requests:
        description: 'Запросов к Steam за раунд (100 матчей на запрос)'
        default: '1500'
      ask:
        description: 'Сколько минут ждать кнопку «Собрать ещё» (0 — не спрашивать)'
        default: '10'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/collect.mjs             --source=steam             --requests=${{ inputs.requests || 1500 }}             --ask=${{ inputs.ask || 10 }}

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stats.json
          git diff --staged --quiet && exit 0
          git commit -m "Обновить снапшот статистики [skip ci]"
          # За время сбора в main могли попасть другие коммиты
          git pull --rebase --autostash || true
          git push
