name: Collect match stats

# Данные копятся сами: каждый прогон добавляет матчи к снапшоту.
on:
  schedule:
    - cron: '17 3 * * *'   # ежедневно ночью
  workflow_dispatch:
    inputs:
      requests:
        description: 'Запросов к Steam за раунд (100 матчей на запрос)'
        default: '1500'
      ask:
        description: 'Сколько минут ждать кнопку «Собрать ещё» (0 — не спрашивать)'
        default: '10'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/collect.mjs             --source=steam             --requests=${{ inputs.requests || 1500 }}             --ask=${{ inputs.ask || 10 }}

      - name: Notify finish
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ job.status }}
        run: node scripts/notify-finish.mjs

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stats.json
          git diff --staged --quiet && exit 0
          git commit -m "Обновить снапшот статистики [skip ci]"

          # Сбор идёт больше часа, за это время в main попадают другие коммиты.
          # Снапшот построчно не сливается, поэтому при конфликте берём свой
          # (он содержит все прежние данные плюс новые) и пробуем снова.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "снапшот отправлен с попытки $attempt"
              exit 0
            fi
            echo "push отклонён, подтягиваю main (попытка $attempt)"
            git fetch origin main
            git rebase origin/main -X ours || {
              git checkout --ours public/stats.json
              git add public/stats.json
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            }
            sleep 5
          done
          echo "не удалось отправить снапшот за 5 попыток"
          exit 1
